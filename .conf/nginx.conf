server {
    listen 80;  # HTTP uchun tinglash

    server_name api.geostat.uz 84.247.136.212;
    client_max_body_size 100M;

    location /static/ {
        alias /root/GeoPortal/static/;  # Static fayllar konteyner ichida joylashgan
    }

    # Media fayllar uchun sozlash
    location /media/ {
        alias /root/GeoPortal/media/;  # Media fayllarni to'g'ri yo'naltirish
    }

    localtion / {
        proxy_pass http://localhost:3000;  # Django ilovasiga so'rovlarni yo'naltirish
        try_files $uri /index.html;
    }

    # Django ilovasiga so'rovlarni yo'naltirish
    location /v1/api/ {
        proxy_pass http://localhost:8010;  # Django ilovasiga so'rovni yo'naltirish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}