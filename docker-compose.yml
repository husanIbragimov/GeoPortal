  web:
    build: .
    container_name: fastapi
    networks:
      - shared_network
    command: >
      /bin/sh -c "while ! nc -z redis 6379; do sleep 1; done;
                  while ! nc -z postgres 5432; do sleep 1; done;
                  while ! nc -z mongodb 27017; do sleep 1; done;
                  alembic upgrade head
                  fastapi run main.py"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8010:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - mongodb
      - redis

  mongodb:
    image: mongo:8.0.9-noble
    container_name: gismongo
    networks:
      - shared_network
    volumes:
      - ./.volumes/mongo:/data/db
    ports:
      - "27017:27017"
    env_file:
      - .env

  postgres:
    image: postgres:17.0
    container_name: gispsql
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./.volumes/pgdata:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - shared_network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.volumes/redis_data:/data
    networks:
      - shared_network
    command: [ "redis-server", "--appendonly", "yes" ]

networks:
  shared_network:
    driver: bridge
